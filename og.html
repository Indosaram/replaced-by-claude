<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("public/fonts/fraunces-700.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("public/fonts/inter-400.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("public/fonts/inter-600.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f4ede1;
        color: #1f1b16;
      }
      .frame {
        width: 1200px;
        height: 630px;
        padding: 64px 80px 40px;
        display: flex;
        flex-direction: column;
      }
      .kicker {
        margin: 0 0 18px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b6257;
      }
      h1 {
        margin: 0;
        max-width: 960px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        font-size: 72px;
        line-height: 1.05;
      }
      .big {
        margin: 28px 0 0;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        font-size: 150px;
        line-height: 1;
        color: #c2410c;
      }
      .footer {
        margin-top: auto;
        padding-top: 20px;
        border-top: 2px solid #d9cbb5;
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 24px;
        color: #6b6257;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="kicker">A very scientific estimate</p>
      <h1>How long until Claude replaces you?</h1>
      <p class="big">4h 12m</p>
      <div class="footer">indosaram.github.io/replaced-by-claude &middot; @indo_yoon</div>
    </div>
  </body>
</html>
